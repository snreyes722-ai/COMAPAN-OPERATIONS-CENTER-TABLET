<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comapan MES – Terminal de Despacho</title>
<style>
/* ===== TOKENS (idénticos a la pantalla de Programación Detallada) ===== */
:root{
  --bg:#0b0e13; --surface:#141a22; --surface-2:#1b232e; --border:#2a3441;
  --text:#e6ebf2; --text-muted:#8b97a8;
  --accent:#1f6feb; --accent-hover:#3b8bff;
  --ok:#3fb950; --info:#1f6feb; --warn:#f0883e; --danger:#f85149; --neutral:#6e7781;
  --radius:6px; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent-hover);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ===== LIENZO: tableta 1280x800 con bisel, escalada por JS ===== */
#stage{position:fixed;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;background:#020304;border-radius:36px;padding:14px;box-shadow:0 0 0 2px #222b36,0 20px 60px rgba(0,0,0,.7)}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}

/* ===== HEADER ===== */
.header{height:64px;flex-shrink:0;background:#07090c;border-bottom:2px solid var(--accent-hover);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:12px}
.hl,.hr{display:flex;align-items:center;gap:12px}
.menu-btn{width:56px;height:56px;border-radius:var(--radius);font-size:26px}
.menu-btn:active,.btn:active:not(:disabled),.card:active,.opt:active{transform:scale(.97);filter:brightness(1.2)}
.brand{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.brand span{color:var(--text-muted);font-weight:400}
.hc{color:var(--text-muted);font-size:16px}.hc b{color:var(--text);font-weight:600}
.hr{color:var(--text-muted);font-size:16px}
.bat{display:inline-flex;align-items:center;gap:6px}
.bat i{width:26px;height:13px;border:2px solid var(--text-muted);border-radius:3px;position:relative;display:inline-block}
.bat i::before{content:"";position:absolute;inset:1px;width:82%;background:var(--ok);border-radius:1px}
.wifi{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.wifi i{width:4px;background:var(--text);border-radius:1px}
.clock{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;min-width:84px;text-align:right}

/* ===== CUERPO ===== */
.body{flex:1;min-height:0;display:grid;grid-template-columns:35fr 65fr}
.col{min-height:0;display:flex;flex-direction:column}
.col--q{border-right:1px solid var(--border);background:var(--surface)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px}

/* ===== COLA DE TAREAS ===== */
.q-head{padding:16px 16px 4px}
.q-head h2{font-size:18px}
.q-head p{color:var(--text-muted);margin-top:2px}
.card{display:block;width:100%;text-align:left;min-height:110px;margin-bottom:12px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--border);border-left:6px solid var(--neutral);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.s-en-proceso{border-left-color:var(--info)}
.card.s-completada{border-left-color:var(--ok);opacity:.8}
.card.s-bloqueada{border-left-color:var(--danger)}
.card.active{border:2px solid var(--accent-hover);background:rgba(31,111,235,.14)}
.card .t1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .id{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.card .mat{font-size:18px;margin-top:4px}
.card .dst{color:var(--text-muted)}
.card .why{margin-top:6px;color:#ff938d;font-size:16px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== PILLS ===== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:16px;font-weight:600;border:1px solid;white-space:nowrap}
.pill--completada{color:var(--ok);border-color:var(--ok);background:rgba(63,185,80,.12)}
.pill--en-proceso{color:#6aa5ff;border-color:var(--info);background:rgba(31,111,235,.15)}
.pill--pendiente{color:var(--text-muted);border-color:var(--neutral);background:rgba(110,119,129,.14)}
.pill--bloqueada{color:#ff938d;border-color:var(--danger);background:rgba(248,81,73,.12)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--info);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,139,255,.7)}100%{box-shadow:0 0 0 9px rgba(59,139,255,0)}}

/* ===== DETALLE ===== */
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.d-head h2{font-size:22px;line-height:1.25}
.d-head .id{color:var(--text-muted);font-variant-numeric:tabular-nums}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.fefo{border-left:6px solid var(--accent);display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.fefo small{display:block;color:var(--text-muted);font-size:16px}
.fefo .v{font-size:19px;font-weight:600}
.fefo .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.venc{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;font-size:16px;font-weight:600;color:var(--warn);border:1px solid var(--warn);background:rgba(240,136,62,.14);vertical-align:middle}
.alert{border-left:6px solid var(--warn);display:flex;gap:12px;align-items:flex-start}
.alert .ic{color:var(--warn);font-size:26px;line-height:1}
.cold .row{display:flex;justify-content:space-between;align-items:baseline}
.cold .time{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width 1s linear,background .3s}
.reg{color:var(--text-muted)}

/* ===== BOTONERA ===== */
.actions{flex-shrink:0;padding:12px 16px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.btn{position:relative;overflow:hidden;width:100%;border-radius:var(--radius);font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:#fff;min-height:72px;box-shadow:var(--shadow)}
.btn:disabled{background:var(--surface-2);color:var(--text-muted);opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.done{background:var(--ok);color:#06140a;opacity:1}
.btn--sm{min-height:56px;font-size:17px;background:rgba(248,81,73,.14);color:#ff938d;border:1px solid var(--danger)}
.scanline{position:absolute;left:0;right:0;height:4px;background:#9fe5ff;box-shadow:0 0 12px #9fe5ff;animation:scan .7s linear infinite}
@keyframes scan{from{top:0}to{top:100%}}

/* ===== ÉXITO ===== */
.success{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:32px;animation:fade .4s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.success .chk{width:96px;height:96px;border-radius:50%;border:5px solid var(--ok);color:var(--ok);font-size:56px;display:grid;place-items:center}
.success h2{font-size:30px;max-width:640px}
.success p{color:var(--text-muted);font-size:20px}
.success .btn{width:auto;padding:0 36px;margin-top:8px}
.col--d{position:relative}

/* ===== MODAL / TOAST / MENÚ ===== */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center}
.modal{width:560px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.modal h3{font-size:22px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 14px;margin-bottom:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);font-size:18px;text-align:left}
.opt[aria-checked="true"]{border-color:var(--accent-hover);background:rgba(31,111,235,.16)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--text-muted);flex-shrink:0}
.opt[aria-checked="true"] .rd{border-color:var(--accent-hover);background:radial-gradient(var(--accent-hover) 45%,transparent 50%)}
.m-act{display:flex;gap:12px;margin-top:8px}
.m-act .btn{min-height:56px;font-size:18px}
.btn--ghost{background:var(--surface-2);border:1px solid var(--border);color:var(--text)}
#toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;background:var(--surface-2);border:1px solid var(--ok);border-left:6px solid var(--ok);border-radius:var(--radius);padding:14px 22px;font-size:17px;box-shadow:var(--shadow);max-width:720px;animation:fade .25s}
#toast.err{border-color:var(--danger)}
.drawer-ov{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:320px;background:var(--surface);border-right:2px solid var(--accent-hover);padding:12px;transform:translateX(-100%);transition:transform .25s ease}
.drawer-ov.open .drawer{transform:none}
.drawer h3{padding:12px 8px;color:var(--text-muted);font-size:16px;font-weight:600}
.drawer button{display:block;width:100%;min-height:60px;text-align:left;padding:0 16px;font-size:19px;border-radius:var(--radius)}
.drawer button:active{background:var(--surface-2)}
.drawer .cur{background:rgba(31,111,235,.16);border-left:4px solid var(--accent-hover)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage"><div id="screen">

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="hl">
    <button class="menu-btn" id="btnMenu" aria-label="Abrir menú">☰</button>
    <div class="brand">COMAPAN MES <span>| Terminal de Despacho</span></div>
  </div>
  <div class="hc" id="hOper"></div>
  <div class="hr">
    <span class="bat" aria-label="Batería 82%"><i></i>82%</span>
    <span class="wifi" aria-label="Señal WiFi completa"><i style="height:5px"></i><i style="height:8px"></i><i style="height:12px"></i><i style="height:16px"></i></span>
    <time class="clock" id="clock">--:--:--</time>
  </div>
</header>

<div class="body">
  <!-- ===== COLA DE TAREAS ===== -->
  <section class="col col--q" aria-label="Cola de tareas">
    <div class="q-head"><h2>Órdenes de Movimiento Asignadas</h2><p class="num" id="qCount"></p></div>
    <div class="scroll" id="queue"></div>
  </section>

  <!-- ===== DETALLE ===== -->
  <section class="col col--d" aria-label="Detalle y ejecución">
    <div class="scroll" id="detail"></div>
    <div class="actions" id="actions"></div>
    <div class="success" id="success" hidden></div>
  </section>
</div>

<!-- ===== MODAL ===== -->
<div class="overlay" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">Reportar Problema / Sustituir Lote</h3>
    <div id="mOpts" role="radiogroup" aria-label="Motivo"></div>
    <div class="m-act">
      <button class="btn btn--ghost" id="mCancel">Cancelar</button>
      <button class="btn" id="mSend">Enviar reporte</button>
    </div>
  </div>
</div>

<!-- Menú lateral -->
<div class="drawer-ov" id="drawerOv" hidden>
  <nav class="drawer" aria-label="Menú">
    <h3>Menú del operador</h3>
    <button class="cur" data-m="cola">Cola de tareas</button>
    <button data-m="hist">Historial</button>
    <button data-m="out">Cerrar sesión</button>
  </nav>
</div>
</div></div>

<script>
/* ===== JS: DATOS ===== */
const operador = { nombre:"Juan Pérez", rol:"Logística Interna" };
const ordenes = [
 { id:"MV-102", material:"Huevo Líquido", destino:"E3 - Batidora", estado:"en-proceso", frio:true,
   titulo:"Traslado de Material Crítico (Control de Frío)",
   origen:"Cuarto Frío A - Estante 2", lote:"HL-089", vence:"Vence hoy", cantidad:"20 kg",
   aviso:"Material perecedero. Tiempo máximo fuera de refrigeración: 15 minutos.",
   habilita:"Equipo E3 habilitado para mezclar." },
 { id:"MV-103", material:"Macerado de Vino", destino:"E4 - Inyectora", estado:"pendiente",
   titulo:"Traslado de Líquido de Proceso",
   origen:"Tanque de Macerado T-02 (Área de Líquidos)", lote:"MV-0412", vence:"Vence en 6 días", cantidad:"6.5 L",
   aviso:"Bombear por línea sanitaria. Verificar válvula de E4 cerrada antes de conectar.",
   habilita:"Equipo E4 habilitado para inyectar." },
 { id:"MV-104", material:"Harina", destino:"E3 - Batidora", estado:"bloqueada",
   titulo:"Traslado de Materia Prima Seca",
   motivo:"Espera de equipo: montacargas asignado a MV-102. Se libera al completar MV-102.",
   origen:"Almacén Seco - Rack 4", lote:"HR-217", vence:"Vence en 45 días", cantidad:"35 kg",
   aviso:"Evitar humedad. Usar estiba limpia.", habilita:"Harina disponible en E3." }
];
const ETQ = {completada:"Completado ✓","en-proceso":"En Curso",pendiente:"Pendiente",bloqueada:"Bloqueada"};
const MOTIVOS = ["Lote vencido o dañado","Cantidad insuficiente","Montacargas averiado","Otro"];
const COLD_MAX = 900; // 15 min en segundos

/* Estado de ejecución */
const st = { activa:0, paso:0, scanning:false, scanHora:"", t0:0, timer:null, elapsed:0, done:[], autoNext:null, motivo:0 };
const $ = id => document.getElementById(id);
const act = () => ordenes[st.activa];
const mmss = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const hhmm = d => d.toLocaleTimeString("es-CO",{hour12:false});

/* ===== JS: HEADER ===== */
$("hOper").innerHTML = `Operador: <b>${operador.nombre}</b> | Rol: <b>${operador.rol}</b>`;
const tick = () => { $("clock").textContent = hhmm(new Date()); };
tick(); setInterval(tick,1000);

/* Escala del lienzo manteniendo 16:10 */
function fit(){
  const s = Math.min(innerWidth/1300, innerHeight/820, 1.5);
  $("stage").style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize",fit); fit();

/* ===== JS: COLA DE TAREAS ===== */
function renderCola(){
  $("qCount").textContent = `${st.done.length} de ${ordenes.length} completadas`;
  // pendientes en su orden original; completadas al final (trazabilidad)
  const lista = ordenes.filter(o=>o.estado!=="completada").concat(st.done.map(id=>ordenes.find(o=>o.id===id)));
  $("queue").innerHTML = lista.map(o=>`
    <button class="card s-${o.estado} ${o===act()&&o.estado!=="completada"?"active":""}" data-id="${o.id}" aria-label="Orden ${o.id} ${o.material}, ${ETQ[o.estado]}">
      <div class="t1"><span class="id">${o.id}</span>
        <span class="pill pill--${o.estado}">${o.estado==="en-proceso"?'<span class="dot"></span>':""}${o.estado==="bloqueada"?"🔒 ":""}${ETQ[o.estado]}</span></div>
      <div class="mat">${o.material}</div>
      <div class="dst">Destino: ${o.destino}</div>
      ${o.estado==="bloqueada"?`<div class="why">🔒 ${o.motivo}</div>`:""}
    </button>`).join("");
}
$("queue").addEventListener("click",e=>{
  const c = e.target.closest(".card"); if(!c) return;
  const o = ordenes.find(x=>x.id===c.dataset.id);
  if(o.estado==="bloqueada"||o.estado==="pendiente"){
    c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake");
    toast(o.estado==="bloqueada"?o.motivo:`${o.id} se habilita al completar la orden en curso.`,true);
  }
});

/* ===== JS: DETALLE ===== */
function renderDetalle(){
  const o = act();
  $("detail").innerHTML = `
    <div class="d-head"><div><h2>${o.titulo}</h2><div class="id">Orden ${o.id} · ${o.material}</div></div>
      <span class="pill pill--en-proceso"><span class="dot"></span>En Curso</span></div>
    <div class="box fefo">
      <div><small>Tomar de</small><div class="v">${o.origen}</div></div>
      <div><small>Entregar en</small><div class="v">${o.destino}</div></div>
      <div><small>Lote obligatorio (FEFO)</small><span class="big">${o.lote}</span><span class="venc">${o.vence}</span></div>
      <div><small>Cantidad</small><span class="big">${o.cantidad}</span></div>
    </div>
    <div class="box alert"><span class="ic" aria-hidden="true">⚠</span><div>${o.aviso}</div></div>
    ${o.frio?`<div class="box cold"><div class="row"><span>Cronómetro de cadena de frío</span><span class="time" id="cTime">15:00</span></div><div class="bar"><i id="cBar"></i></div></div>`:""}
    <p class="reg num" id="reg"></p>`;
  renderBotones();
}
function renderBotones(){
  const o = act(), p = st.paso, destCorto = o.destino.split(" - ")[0];
  const b1 = st.scanning ? `<span class="scanline"></span>Escaneando…` : p>0 ? `Lote Validado ✓` : `▣ Escanear Lote ${o.lote} en Origen`;
  const b2 = p>1 ? "En Tránsito ✓" : (p<1?"🔒 ":"")+"Confirmar Transporte Seguro";
  const b3 = (p<2?"🔒 ":"")+`Confirmar Entrega en ${destCorto}`;
  $("actions").innerHTML = `
    <button class="btn ${p>0?"done":""}" id="b1" ${p>0||st.scanning?"disabled":""}>${b1}</button>
    <button class="btn ${p>1?"done":""}" id="b2" ${p!==1?"disabled":""}>${b2}</button>
    <button class="btn" id="b3" ${p!==2?"disabled":""}>${b3}</button>
    <button class="btn btn--sm" id="b4">⚑ Reportar Problema / Sustituir Lote</button>`;
  $("b1").addEventListener("click",escanear);
  $("b2").addEventListener("click",transporte);
  $("b3").addEventListener("click",entrega);
  $("b4").addEventListener("click",abrirModal);
  if(st.scanHora && $("reg")) $("reg").textContent = `Lote ${o.lote} validado a las ${st.scanHora}`;
}

/* Paso 1: escaneo (700 ms) */
function escanear(){
  if(st.paso!==0||st.scanning) return;
  st.scanning = true; renderBotones();
  setTimeout(()=>{ st.scanning=false; st.paso=1; st.scanHora=hhmm(new Date()); renderBotones(); },700);
}
/* Paso 2: transporte + cronómetro */
function transporte(){
  if(st.paso!==1) return;
  st.paso = 2; st.t0 = Date.now(); renderBotones();
  if(act().frio){
    clearInterval(st.timer);
    st.timer = setInterval(cronometro,1000);
  }
}
function cronometro(){
  const el = Math.floor((Date.now()-st.t0)/1000), rest = Math.max(0,COLD_MAX-el);
  const t=$("cTime"), b=$("cBar"); if(!t) return;
  t.textContent = mmss(rest); b.style.width = (rest/COLD_MAX*100)+"%";
  const col = rest<120?"var(--danger)":rest<300?"#e3b341":"var(--ok)";
  b.style.background = col; t.style.color = rest<300?col:"";
}
/* Paso 3: entrega → pantalla de éxito */
function entrega(){
  if(st.paso!==2) return;
  clearInterval(st.timer);
  st.elapsed = Math.floor((Date.now()-st.t0)/1000);
  const o = act(); o.estado = "completada"; st.done.push(o.id);
  const ultima = st.done.length===ordenes.length;
  $("success").hidden = false;
  $("success").innerHTML = `<div class="chk" aria-hidden="true">✓</div>
    <h2>${ultima?"Todas las órdenes completadas":`Orden ${o.id} Completada. ${o.habilita}`}</h2>
    <p class="num">${o.frio?"Tiempo total fuera de refrigeración":"Tiempo en tránsito"}: <b>${mmss(st.elapsed)}</b></p>
    ${ultima?`<p>Trazabilidad registrada para ${ordenes.length} órdenes (${ordenes.map(x=>x.id).join(", ")}).</p>`:`<button class="btn" id="bNext">Continuar con la siguiente orden</button>`}`;
  renderCola();
  if(!ultima){ $("bNext").addEventListener("click",siguiente); $("bNext").focus(); st.autoNext = setTimeout(siguiente,3000); }
}
function siguiente(){
  clearTimeout(st.autoNext); st.autoNext=null;
  const i = ordenes.findIndex(o=>o.estado!=="completada"); if(i<0) return;
  st.activa=i; st.paso=0; st.scanHora=""; ordenes[i].estado="en-proceso";
  $("success").hidden = true; renderCola(); renderDetalle();
}

/* ===== JS: MODAL ===== */
function abrirModal(){
  st.motivo=0; pintarOpts(); $("modal").hidden=false; $("mSend").focus();
}
function pintarOpts(){
  $("mOpts").innerHTML = MOTIVOS.map((m,i)=>`<button class="opt" role="radio" aria-checked="${i===st.motivo}" data-i="${i}"><span class="rd"></span>${m}</button>`).join("");
}
$("mOpts").addEventListener("click",e=>{ const b=e.target.closest(".opt"); if(b){ st.motivo=+b.dataset.i; pintarOpts(); } });
$("mCancel").addEventListener("click",()=>{ $("modal").hidden=true; });
$("mSend").addEventListener("click",()=>{
  $("modal").hidden=true;

/* Toast */
let toastT;
function toast(msg,err){
  document.getElementById("toast")?.remove();
  const t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); t.textContent=msg;
  if(err) t.classList.add("err");
  $("screen").appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200);
}

/* ===== JS: MENÚ LATERAL ===== */
const cerrarMenu = () => { $("drawerOv").classList.remove("open"); setTimeout(()=>{$("drawerOv").hidden=true},250); };
$("btnMenu").addEventListener("click",()=>{ $("drawerOv").hidden=false; requestAnimationFrame(()=>$("drawerOv").classList.add("open")); });
$("drawerOv").addEventListener("click",e=>{
  const b = e.target.closest("button[data-m]");
  if(b){ if(b.dataset.m==="hist") toast(`${st.done.length} órdenes completadas en este turno`); if(b.dataset.m==="out") toast("Cierre de sesión simulado"); cerrarMenu(); }
  else if(!e.target.closest(".drawer")) cerrarMenu(); // tocar fuera cierra
});
